name: talentshift-core-prod

services:
  app:
    image: talentshift-core:latest
    build: {context: ., dockerfile: Dockerfile}
    restart: always
    environment:
      # DigitalOcean Managed PostgreSQL
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      # Turn OFF demo in production
      APP_DEMO_USER_ENABLED: "false"

      # Admin Setup
      APP_ADMIN_USER_ENABLED: "true"
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@talentshift.local}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
      APP_ADMIN_KEY: ${APP_ADMIN_KEY:-}

      # Job Settings
      JOB_COLLECTION_ON_STARTUP: "true"
      JOB_VERIFICATION_CRON: ${JOB_VERIFICATION_CRON:-0 0 */3 * * *}

      # Optional AI
      AI_ENABLED: "false"

      APP_UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_BYTES: 5242880
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  uploads_data:
  logs_data:
